<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Registration</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Register User</h1>
        <form id="user-form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required min="1">
            </div>
            <button type="submit">Register</button>
        </form>
        <div id="confirmation-message" class="confirmation"></div>
        <div id="error-message" class="error"></div>
    </div>

    <script>
        document.getElementById('user-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const form = event.target;
            const name = form.elements['name'].value;
            const email = form.elements['email'].value;
            const age = form.elements['age'].value;
            const confirmationMessageDiv = document.getElementById('confirmation-message');
            const errorMessageDiv = document.getElementById('error-message');

            // Clear previous messages
            confirmationMessageDiv.textContent = '';
            errorMessageDiv.textContent = '';

            // Client-side validation
            if (!name || !email || !age) {
                errorMessageDiv.textContent = 'All fields are required.';
                return;
            }
            if (!/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(email)) {
                errorMessageDiv.textContent = 'Invalid email format.';
                return;
            }
            const ageNum = parseInt(age, 10);
            if (isNaN(ageNum) || ageNum < 1) {
                errorMessageDiv.textContent = 'Age must be a positive number.';
                return;
            }

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: name, email: email, age: ageNum })
                });

                const result = await response.json();

                if (response.ok) {
                    confirmationMessageDiv.textContent = result.message;
                    form.reset(); // Clear the form
                } else {
                    errorMessageDiv.textContent = result.error || 'An unknown error occurred.';
                }
            } catch (error) {
                console.error('Error submitting form:', error);
                errorMessageDiv.textContent = 'An error occurred while submitting the form. Please try again later.';
            }
        });
    </script>
</body>
</html>
